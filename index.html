<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>經典版武器傷害計算器</title>
<meta name="description" content="選職業、武器、強化和狀態，比較天堂經典版單手劍、匕首、雙手劍、魔杖和弓的每刀和每秒傷害；打人會照對方 AC 算命中率。">
<meta property="og:title" content="經典版武器傷害計算器">
<meta property="og:description" content="選職業、武器、強化和狀態，比較天堂經典版單手劍、匕首、雙手劍、魔杖和弓的每刀和每秒傷害；打人會照對方 AC 算命中率。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one calm column of grouped panels in a Settings-like rhythm; weapon results as an auto-fill card grid */
:root{
  --bg:#f5f5f7;--surface:#ffffff;--inset:#eeeef1;--seg-on:#ffffff;
  --fg:#1d1d1f;--fg2:#6e6e73;--fg3:#8e8e93;--line:rgba(60,60,67,.16);
  --accent:#0071e3;--accent-soft:rgba(0,113,227,.10);
  --on:#34c759;--good:#1f8a3d;--good-soft:rgba(52,199,89,.14);--knob:#ffffff;
  --warn:#a35a00;--warn-soft:rgba(255,159,10,.16);
  --shadow:0 1px 1px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.06);
  --seg-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --r-lg:20px;--r-md:12px;--r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000;--surface:#1c1c1e;--inset:#2c2c2e;--seg-on:#636366;
  --fg:#f5f5f7;--fg2:#a1a1a6;--fg3:#8e8e93;--line:rgba(235,235,245,.16);
  --accent:#2997ff;--accent-soft:rgba(41,151,255,.18);
  --on:#30d158;--good:#32d74b;--good-soft:rgba(50,215,75,.16);--knob:#ffffff;
  --warn:#ffb340;--warn-soft:rgba(255,179,64,.16);
  --shadow:0 0 0 .5px rgba(255,255,255,.07);--seg-shadow:0 1px 3px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1c1c1e;--inset:#2c2c2e;--seg-on:#636366;
  --fg:#f5f5f7;--fg2:#a1a1a6;--fg3:#8e8e93;--line:rgba(235,235,245,.16);
  --accent:#2997ff;--accent-soft:rgba(41,151,255,.18);
  --on:#30d158;--good:#32d74b;--good-soft:rgba(50,215,75,.16);--knob:#ffffff;
  --warn:#ffb340;--warn-soft:rgba(255,179,64,.16);
  --shadow:0 0 0 .5px rgba(255,255,255,.07);--seg-shadow:0 1px 3px rgba(0,0,0,.45);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:44px 64px;display:flex;flex-direction:column;gap:30px}
header{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.06em}
h1{font-family:var(--display);font-size:clamp(34px,6vw,52px);font-weight:700;letter-spacing:-.025em;line-height:1.06;margin:0;text-wrap:balance}
.lede{font-size:17px;color:var(--fg2);max-width:38em;margin:0}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-inline:4px}
.sec-title{font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.04em;margin:0;display:flex;align-items:center;gap:8px}
.sec-note{font-size:13px;color:var(--fg3)}
.beta-note{margin:0 2px;font-size:12px;line-height:1.6;color:var(--fg3);word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty}
#size-seg{grid-template-columns:repeat(3,minmax(0,1fr))}
[hidden]{display:none!important}
.panel{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.label{display:block;font-size:13px;color:var(--fg2);margin-bottom:6px}
.hint{margin:8px 2px 0;font-size:13px;line-height:1.6;color:var(--fg2)}
.hint b{color:var(--fg);font-variant-numeric:tabular-nums}
.basis-name{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.field{min-width:0}
.field label{display:block;font-size:13px;color:var(--fg2);margin-bottom:6px}
.field-hint{margin:6px 2px 0;font-size:12px;line-height:1.45;color:var(--fg3);text-wrap:pretty;text-spacing-trim:trim-start}
.nowrap{white-space:nowrap}
.stepper{display:flex;align-items:center;background:var(--inset);border-radius:var(--r-md);overflow:hidden}
.stepper button{appearance:none;border:0;background:transparent;width:42px;height:42px;flex:none;font-size:22px;line-height:1;color:var(--accent);cursor:pointer}
.stepper button:disabled{color:var(--fg3);cursor:default}
.stepper input{flex:1;min-width:0;border:0;background:transparent;text-align:center;font:inherit;font-size:17px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;height:42px;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:disabled{color:var(--fg3)}
.stepper.sm button{width:38px;height:38px;font-size:20px}
.stepper.sm input{height:38px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--inset);color:var(--fg2)}
.chip b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:600;line-height:1.5;padding:0 7px;border-radius:999px;background:var(--inset);color:var(--fg2);white-space:nowrap}
.tag.meas{background:var(--good-soft);color:var(--good)}
.tag.guess{background:var(--warn-soft);color:var(--warn)}
.chip .tag{background:var(--surface)}
.chip .tag.meas{background:var(--good-soft)}
.chip .tag.guess{background:var(--warn-soft)}
.toggles{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-top:.5px solid var(--line);cursor:pointer}
.row:first-child{border-top:0;padding-top:2px}
.row:last-child{padding-bottom:2px}
.row-l{display:flex;flex-direction:column}
.row-n{font-size:16px;font-weight:500}
.row-v{font-size:13px;color:var(--fg2)}
.switch{position:relative;display:inline-block;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;border-radius:999px;background:var(--inset);transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 2px 6px rgba(0,0,0,.22);transition:transform .2s}
.switch input:checked+.track{background:var(--on)}
.switch input:checked+.track::after{transform:translateX(20px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.target-bar{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:12px 16px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--inset);border-radius:var(--r-sm);padding:2px;gap:2px;flex:1 1 220px;max-width:360px}
.seg button{appearance:none;border:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;font-weight:500;padding:7px 6px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--seg-on);box-shadow:var(--seg-shadow);font-weight:600}
.inline-toggle{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;cursor:pointer}
div.row{cursor:default}
.selwrap.row-sel{flex:none}
.row-sel select{width:auto;padding:8px 34px 8px 12px}
.chip-on{background:var(--accent-soft);color:var(--accent)}
.chip-warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.seg-field{max-width:none;flex:none;grid-template-columns:repeat(4,minmax(0,1fr))}
.field-cls{grid-column:1/-1}.field-cls .seg-field{max-width:440px}
.seg-field button{padding:11px 6px;font-size:15px}
#mode-seg{grid-template-columns:repeat(2,minmax(0,1fr));max-width:280px;margin-top:8px}
.undead-note{font-size:13px;font-weight:400;color:var(--fg3)}
.weapons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.wcard{position:relative;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.wcard.best{box-shadow:var(--shadow),inset 0 0 0 2px var(--accent)}
.wtop{display:flex;align-items:center;gap:8px}
.selwrap{position:relative;flex:1;min-width:0}
.selwrap::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:2px solid var(--fg2);border-bottom:2px solid var(--fg2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select{appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:16px;font-weight:600;color:var(--fg);background:var(--inset);border:0;border-radius:var(--r-md);padding:10px 36px 10px 12px;cursor:pointer;text-overflow:ellipsis}
.rm{appearance:none;border:0;width:32px;height:32px;flex:none;border-radius:50%;background:var(--inset);color:var(--fg2);font-size:18px;line-height:1;cursor:pointer}
.enc-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.enc-row label{font-size:14px;color:var(--fg2)}
.enc-note{display:block;font-size:12px;font-weight:600;color:var(--accent)}
.enc-row .stepper{width:150px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--inset);border-radius:var(--r-md)}
.mini>div{padding:8px 4px;text-align:center;min-width:0}
.mini>div+div{border-left:.5px solid var(--line)}
.k{font-size:12px;color:var(--fg2)}
.mini .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.big{display:flex;flex-direction:column;gap:2px;padding:2px 2px 0}
.big-head{display:flex;align-items:center;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.big .k{font-size:13px}
.big .v{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-.025em;line-height:1.05;font-variant-numeric:tabular-nums}
.wcard.best .big .v{color:var(--accent)}
.sub{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:600;color:var(--surface);background:var(--accent);padding:2px 9px;border-radius:999px}
.add{appearance:none;border:1.5px dashed var(--line);background:transparent;border-radius:var(--r-lg);min-height:140px;color:var(--accent);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lede,.hint,.field-hint,.row-v,.sec-note{word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty}
@media (min-width:760px){.toggles{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}.toggles>.row:nth-child(2){border-top:0;padding-top:2px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">天堂經典版・單手劍、匕首、雙手劍、魔杖、弓</div>
    <h1>武器傷害計算器</h1>
    <p class="lede" id="lede">選職業和武器，填強化、力量和狀態，就能比較每刀傷害和每秒傷害（DPS）。打人會照對方的 AC 算命中率。</p>
    <div class="seg seg-field" role="radiogroup" aria-label="近距離或遠距離" id="mode-seg">
      <button type="button" role="radio" data-mode="melee">近距離</button>
      <button type="button" role="radio" data-mode="ranged">遠距離</button>
    </div>
  </header>

  <section aria-labelledby="t-char">
    <div class="sec-head"><h2 class="sec-title" id="t-char">角色</h2></div>
    <div class="panel">
      <div>
        <span class="label">攻速基準</span>
        <div class="basis-name" id="basis-name">黑暗騎士</div>
        <p class="hint" id="preset-hint"></p>
      </div>
      <div class="fields">
        <div class="field field-cls">
          <span class="label">職業</span>
          <div class="seg seg-field" role="radiogroup" aria-label="職業" id="cls-seg">
            <button type="button" role="radio" data-cls="knight">騎士</button>
            <button type="button" role="radio" data-cls="royal">王族</button>
            <button type="button" role="radio" data-cls="elf">妖精</button>
            <button type="button" role="radio" data-cls="mage">法師</button>
          </div>
        </div>
        <div class="field">
          <label for="f-level">等級</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-for="f-level" aria-label="等級減 1">−</button>
            <input id="f-level" type="number" inputmode="numeric" min="1" max="99" step="1">
            <button type="button" data-step="1" data-for="f-level" aria-label="等級加 1">+</button>
          </div>
        </div>
        <div class="field" data-show="melee">
          <label for="f-str">力量 STR</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-for="f-str" aria-label="力量減 1">−</button>
            <input id="f-str" type="number" inputmode="numeric" min="8" max="50" step="1">
            <button type="button" data-step="1" data-for="f-str" aria-label="力量加 1">+</button>
          </div>
          <p class="field-hint">照角色面板填，含防具、飾品和體魄強健術，不含武器的力量</p>
        </div>
        <div class="field" data-show="ranged" hidden>
          <label for="f-dex">敏捷 DEX</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-for="f-dex" aria-label="敏捷減 1">−</button>
            <input id="f-dex" type="number" inputmode="numeric" min="1" max="60" step="1">
            <button type="button" data-step="1" data-for="f-dex" aria-label="敏捷加 1">+</button>
          </div>
          <p class="field-hint">照角色面板填，含裝備和通暢氣脈術</p>
        </div>
        <div class="field" data-show="ranged" hidden>
          <label for="f-arrow">箭</label>
          <div class="selwrap"><select id="f-arrow"></select></div>
        </div>
        <div class="field" data-show="melee">
          <label for="f-doll">魔法娃娃</label>
          <div class="selwrap"><select id="f-doll"></select></div>
        </div>
        <div class="field" data-show="ranged" hidden>
          <label for="f-rdoll">魔法娃娃</label>
          <div class="selwrap"><select id="f-rdoll"></select></div>
        </div>
        <div class="field" data-show="melee">
          <label for="f-other">近距離傷害加成</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-for="f-other" aria-label="近距離傷害加成減 1">−</button>
            <input id="f-other" type="number" inputmode="numeric" min="-20" max="50" step="1">
            <button type="button" data-step="1" data-for="f-other" aria-label="近距離傷害加成加 1">+</button>
          </div>
          <p class="field-hint">其他沒列到的近距離傷害</p>
        </div>
        <div class="field" data-show="ranged" hidden>
          <label for="f-rother">遠距離傷害加成</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-for="f-rother" aria-label="遠距離傷害加成減 1">−</button>
            <input id="f-rother" type="number" inputmode="numeric" min="-20" max="50" step="1">
            <button type="button" data-step="1" data-for="f-rother" aria-label="遠距離傷害加成加 1">+</button>
          </div>
          <p class="field-hint">其他沒列到的遠距離傷害</p>
        </div>
        <div class="field" data-show="melee">
          <label for="f-hadj">近距離命中加成</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-for="f-hadj" aria-label="近距離命中加成減 1">−</button>
            <input id="f-hadj" type="number" inputmode="numeric" min="-30" max="30" step="1">
            <button type="button" data-step="1" data-for="f-hadj" aria-label="近距離命中加成加 1">+</button>
          </div>
          <p class="field-hint">其他沒列到的近距離命中</p>
        </div>
        <div class="field" data-show="ranged" hidden>
          <label for="f-rhadj">遠距離命中加成</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-for="f-rhadj" aria-label="遠距離命中加成減 1">−</button>
            <input id="f-rhadj" type="number" inputmode="numeric" min="-30" max="30" step="1">
            <button type="button" data-step="1" data-for="f-rhadj" aria-label="遠距離命中加成加 1">+</button>
          </div>
          <p class="field-hint">其他沒列到的遠距離命中</p>
        </div>
      </div>
      <div class="chips" id="derived"></div>
    </div>
  </section>

  <section aria-labelledby="t-buff">
    <div class="sec-head"><h2 class="sec-title" id="t-buff">狀態</h2></div>
    <div class="panel"><div class="toggles" id="buffs" data-show="melee"></div><div class="toggles" id="rbuffs" data-show="ranged" hidden></div></div>
  </section>

  <section aria-labelledby="t-weap">
    <div class="sec-head"><h2 class="sec-title" id="t-weap">武器比較</h2><span class="sec-note" id="hit-note">DPS 和每分鐘傷害以命中率上限 95% 計算</span></div>
    <div class="panel target-bar">
      <div class="seg" role="radiogroup" aria-label="目標" id="size-seg">
        <button type="button" role="radio" data-size="pvp">打人</button>
        <button type="button" role="radio" data-size="small">小怪</button>
        <button type="button" role="radio" data-size="large">大怪</button>
      </div>
      <label class="inline-toggle" id="undead-wrap">不死系<span class="undead-note" id="undead-note" hidden>這種箭沒有加成</span><span class="switch"><input type="checkbox" id="t-undead"><span class="track" aria-hidden="true"></span></span></label>
    </div>
    <div class="panel" id="pvp-panel">
      <div class="fields">
        <div class="field">
          <label for="f-tac">對象 AC</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-for="f-tac" aria-label="對象 AC減 1">−</button>
            <input id="f-tac" type="number" inputmode="numeric" min="-120" max="10" step="1">
            <button type="button" data-step="1" data-for="f-tac" aria-label="對象 AC加 1">+</button>
          </div>
        </div>
        <div class="field" data-show="ranged" hidden>
          <label for="f-ter">對象 ER</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-for="f-ter" aria-label="對象 ER減 1">−</button>
            <input id="f-ter" type="number" inputmode="numeric" min="0" max="100" step="1">
            <button type="button" data-step="1" data-for="f-ter" aria-label="對象 ER加 1">+</button>
          </div>
        </div>
        <div class="field">
          <label for="f-tdr">對象傷害減免</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-for="f-tdr" aria-label="對象傷害減免減 1">−</button>

// PvP hit model (推測, 11/1): 즐겜러파문's Classic PvP formula (YouTube AgkbQEHfMZg, 2026-04-28; lcinfo.io uses the same code).

function hitRateOf(h,ac){const a=-ac,w=Math.max(8,a);return Math.min(HIT_MAX,Math.max(HIT_MIN,(h-(a/2-6.5+Math.max(1,a)-w))/w));}
function dmgStats(die,flat,ud,dr,maxRoll){  // exact per-hit spread after the target's flat reduction (floor 0: the game shows a fully absorbed hit as a miss)

  for(let r=maxRoll?die:1;r<=die;r++)for(let u=ud?1:0;u<=(ud?20:0);u++){const d=Math.max(0,r+flat+u-dr);sum+=d;n++;if(d<mn)mn=d;if(d>mx)mx=d;}
  return {avg:sum/n,min:mn,max:mx};
}

function rangedHitValue(level,dex){return Math.max(0,Math.min(127,dex))-12+level;}

    return {w,a,e,eb,flat,die,speed:p.bow,ud,ok:canUse(w,state.cls),hit,hitRate,min:st.min,max:st.max,avg:st.avg,perMin:st.avg*p.bow*hitRate,perSec:st.avg*p.bow*hitRate/60};
  });

/* ---- UI ---- */
const KEY="lc-dmg-calc-v2";
const DEFAULT={preset:"dk",cls:"knight",level:55,str:31,doll:"wolf",other:0,size:"pvp",undead:false,tac:-40,tdr:0,hadj:0,buffs:{},weapons:[{n:"細劍",e:9},{n:"水晶短劍",e:7},{n:"瑟魯基之劍",e:7},{n:"古老的劍",e:0}],
  mode:"melee",dex:30,arrow:"arrow",rdoll:"wolf",rother:0,rhadj:0,ter:0,bows:[{n:"十字弓",e:7},{n:"赤焰之弓",e:7},{n:"熾炎天使弓",e:7},{n:"沙哈之弓",e:7}]};  // 遠距離 keeps its own cards, stat, arrow, doll and bonuses
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const $=id=>document.getElementById(id);
const fmtInt=n=>Math.round(n).toLocaleString("zh-TW");
const fmtHalf=n=>Number.isInteger(n)?String(n):n.toFixed(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NUM_KEYS=["level","str","dex","other","rother","tac","ter","tdr","hadj","rhadj"],NUM_IDS=NUM_KEYS.map(k=>"f-"+k);
const LEDE={melee:$("lede").textContent,ranged:"選職業、弓和箭，填強化、敏捷和狀態，就能比較每箭傷害和每秒傷害（DPS）。打人會照對方的 AC 和 ER 算命中率。"};
let state=load();
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s&&Array.isArray(s.weapons)&&s.weapons.length){
      const d=Object.assign(clone(DEFAULT),s);
      d.weapons=d.weapons.slice(0,6).map(x=>({n:weaponByName(x.n).n,e:clamp(parseInt(x.e,10)||0,0,12)}));
      if(!PRESETS[d.preset])d.preset="dk";
      if(!DOLLS.some(x=>x.id===d.doll))d.doll="none";
      if(!["pvp","small","large"].includes(d.size))d.size="small";
      delete d.beta;delete d.betaSet;  // the Beta switch, removed in v43
      if(!CLS[d.cls])d.cls="knight";
      d.undead=!!d.undead;
      d.tac=clamp(Math.round(+d.tac)||0,-120,10);d.tdr=clamp(Math.round(+d.tdr)||0,0,30);d.hadj=clamp(Math.round(+d.hadj)||0,-30,30);
      delete d.rkStr;
      delete d.buffs.pride;  // 傲慢的遺產 switch, removed in v40
      const seen={};
      BUFFS.forEach(b=>{if(b.group&&d.buffs[b.id]){if(seen[b.group])d.buffs[b.id]=false;seen[b.group]=true;}});
      const rseen={};  // 遠距離 pick-ones (its weapon spells are the same switches, already one at most)
      RBUFFS.forEach(b=>{if(b.group&&d.buffs[b.id]){if(rseen[b.group])d.buffs[b.id]=false;rseen[b.group]=true;}});
      if(!["melee","ranged"].includes(d.mode))d.mode="melee";
      d.bows=(Array.isArray(d.bows)&&d.bows.length?d.bows:clone(DEFAULT.bows)).slice(0,6).map(x=>({n:bowByName(x.n).n,e:clamp(parseInt(x.e,10)||0,0,12)}));
      if(!ARROWS.some(x=>x.id===d.arrow))d.arrow="arrow";
      if(!RDOLLS.some(x=>x.id===d.rdoll))d.rdoll="none";
      d.dex=clamp(Math.round(+d.dex)||0,1,60);d.ter=clamp(Math.round(+d.ter)||0,0,100);
      d.rother=clamp(Math.round(+d.rother)||0,-20,50);d.rhadj=clamp(Math.round(+d.rhadj)||0,-30,30);
      return d;
    }
  }catch(e){}
  return clone(DEFAULT);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

function optionsHTML(sel){
  return ["單手劍","匕首","雙手劍","魔杖"].map(g=>`<optgroup label="${g}">`+
    WEAPONS.filter(w=>w.t===g).sort((a,b)=>b.s-a.s||a.n.localeCompare(b.n,"zh-Hant"))
      .map(w=>`<option value="${esc(w.n)}"${w.n===sel?" selected":""}>${esc(w.n)}${w.alias?"（"+w.alias+"）":""}　${w.s}／${w.l}${w.unreleased?"（未開放）":""}${w.event?"（活動）":""}${canUse(w,state.cls)?"":`（${CLS[state.cls]}不能用）`}</option>`).join("")+
    `</optgroup>`).join("");
}
function bowOptionsHTML(sel){
  return BOWS.slice().sort((a,b)=>b.s-a.s||a.n.localeCompare(b.n,"zh-Hant"))
    .map(w=>`<option value="${esc(w.n)}"${w.n===sel?" selected":""}>${esc(w.n)}　${w.s}／${w.l}${w.event?"（活動）":""}${canUse(w,state.cls)?"":`（${CLS[state.cls]}不能用）`}</option>`).join("");
}
function cardHTML(x,i){
  const bow=state.mode==="ranged",a=arrowById(state.arrow);  // 遠距離: a bow card, and its dice add the arrow's
  const w=bow?bowByName(x.n):weaponByName(x.n);
  const big=state.size==="large";
  const info=[];
  if(w.dmg)info.push(bow?`遠距離傷害 ${w.dmg>0?"+":""}${w.dmg}`:`近距離傷害 +${w.dmg}`);
  if(w.str)info.push(`力量 +${w.str}`);
  if(w.oneHand)info.push("單手");
  if(w.proc)info.push(`發動：${w.proc}`,"不計魔法發動傷害");
  if(w.extra)info.push(w.extra);
  if(w.note)info.push(w.note);
  if(w.noEnchant)info.push("不能強化");
  const dis=w.noEnchant?" disabled":"";
  const ds=bow?`${w.s}＋${a.s}`:w.s,dl=bow?`${w.l}＋${a.l}`:w.l,unit=bow?"箭":"刀",noun=bow?"弓":"武器";
  const dice=big?`小怪 ${ds}・<b>大怪 ${dl}</b>`:`<b>小怪 ${ds}</b>・大怪 ${dl}`;
  const chips=(w.unreleased?`<span class="chip chip-warn">未開放</span>`:"")+(w.event?`<span class="chip">活動</span>`:"")+
    (canUse(w,state.cls)?"":`<span class="chip chip-warn">${CLS[state.cls]}不能用</span>`)+
    (bow?"":`<span class="chip">${w.t}</span>`)+`<span class="chip">${dice}</span>`+
    info.map(s=>`<span class="chip">${esc(s)}</span>`).join("")+
    (w.u?`<span class="chip${state.undead&&state.size!=="pvp"?" chip-on":""}">對不死 +1～20</span>`:"")+
    `<span class="chip" id="w${i}-hit" hidden></span>`+
    `<span class="chip chip-on" id="w${i}-hr"></span>`;
  return `<article class="wcard" id="card-${i}">
    <div class="wtop">
      <div class="selwrap"><select id="w${i}-n" data-w="${i}" aria-label="第 ${i+1} 把${noun}">${bow?bowOptionsHTML(w.n):optionsHTML(w.n)}</select></div>
      ${weaponList().length>1?`<button type="button" class="rm" data-rm="${i}" aria-label="移除第 ${i+1} 把${noun}">×</button>`:""}
    </div>
    <div class="enc-row">
      <label for="w${i}-e">強化<span class="enc-note" id="w${i}-eb"></span></label>
      <div class="stepper sm">
        <button type="button" data-step="-1" data-for="w${i}-e" aria-label="強化減 1"${dis}>−</button>
        <input class="enc" id="w${i}-e" data-w="${i}" type="number" inputmode="numeric" min="0" max="12" value="${w.noEnchant?0:x.e}"${dis}>
        <button type="button" data-step="1" data-for="w${i}-e" aria-label="強化加 1"${dis}>+</button>
      </div>
    </div>
    <div class="chips">${chips}</div>
    <div class="mini">
      <div><div class="k">每${unit}最小</div><div class="v" id="r${i}-min"></div></div>
      <div><div class="k">每${unit}平均</div><div class="v" id="r${i}-avg"></div></div>
      <div><div class="k">每${unit}最大</div><div class="v" id="r${i}-max"></div></div>
    </div>
    <div class="big">
      <div class="big-head"><span class="k">每秒傷害 DPS</span><span class="badge" id="r${i}-best" hidden>最高</span></div>
      <div class="v" id="r${i}-ps"></div>
      <div class="sub" id="r${i}-pm"></div>
    </div>
  </article>`;
}
function weaponList(){return state.mode==="ranged"?state.bows:state.weapons;}  // each side keeps its own cards
function renderWeapons(){
  const list=weaponList();
  $("weapons").innerHTML=list.map(cardHTML).join("")+
    (list.length<6?`<button type="button" class="add" id="add">+ 新增${state.mode==="ranged"?"弓":"武器"}</button>`:"");
  update();
}
function rangedDerivedHTML(pvp){
  const lv=rangedLevelBonus(state.level,state.cls==="elf"),buffSum=RBUFFS.reduce((s,b)=>s+(state.buffs[b.id]?b.v:0),0);
  return `<span class="chip">敏捷加成 <b>+${dexBonus(state.dex)}</b></span>`+
    `<span class="chip">${state.cls==="elf"?`等級加成 <b>+${lv}</b> <span class="tag">妖精每 10 級 +1</span>`:`等級加成 <b>+0</b> <span class="tag">只有妖精有</span>`}</span>`+
    `<span class="chip">魔法娃娃 <b>+${rdollById(state.rdoll).v}</b></span>`+
    `<span class="chip">其他傷害加成 <b>${state.rother<0?"":"+"}${state.rother}</b></span>`+
    `<span class="chip">狀態 <b>+${buffSum}</b></span>`+
    (pvp?`<span class="chip">命中（不含弓）<b>${Math.round(rangedBaseHit(state))}</b></span>`:"");
}
function update(){
  const bow=state.mode==="ranged";
  const p=bow?bowSpeedOf(state.cls):speedsOf(state);
  document.querySelectorAll("#mode-seg [data-mode]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.mode===state.mode)));
  document.querySelectorAll("[data-show]").forEach(el=>{el.hidden=el.dataset.show!==state.mode;});
  document.querySelectorAll("#size-seg [data-size]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.size===state.size)));
  document.querySelectorAll("#cls-seg [data-cls]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.cls===state.cls)));
  $("t-undead").checked=state.undead;
  const pvp=state.size==="pvp";
  $("pvp-panel").hidden=!pvp;$("undead-wrap").hidden=pvp;
  $("undead-note").hidden=!(bow&&state.undead&&!arrowById(state.arrow).u);
  $("hit-note").textContent=pvp?"DPS 和每分鐘傷害以推算的命中率計算":"DPS 和每分鐘傷害以命中率上限 95% 計算";
  $("lede").textContent=LEDE[state.mode];
  $("basis-name").textContent=bow?"黑暗巡守":"黑暗騎士";
  $("preset-hint").innerHTML=bow?`${p.desc}：弓每分鐘&nbsp;<b>${p.bow}</b>&nbsp;箭 <span class="tag guess">推算</span>`:
    `${p.desc}：${p.mage?"單手劍、魔杖":"單手劍"}每分鐘&nbsp;<b>${p.sword}</b>&nbsp;刀、匕首&nbsp;<b>${p.dagger}</b>&nbsp;刀`+
    (p.est?"":`、雙手劍&nbsp;<b>${p.twohand}</b>&nbsp;刀`)+` <span class="tag ${p.est?"guess":"meas"}">${p.est?"推算":"實測"}</span>`;
  NUM_KEYS.forEach(k=>{const el=$("f-"+k);if(document.activeElement!==el)el.value=state[k];});
  const sb=strBonus(state.str),lv=levelBonus(state.level,state.cls==="knight");
  const dollV=(DOLLS.find(d=>d.id===state.doll)||DOLLS[0]).v;
  const buffSum=BUFFS.reduce((s,b)=>s+(state.buffs[b.id]?b.v:0),0);
  $("f-doll").value=state.doll;$("f-rdoll").value=state.rdoll;$("f-arrow").value=state.arrow;
  $("derived").innerHTML=bow?rangedDerivedHTML(pvp):
    `<span class="chip">力量加成 <b>+${sb}</b></span>`+
    `<span class="chip">${state.cls==="knight"?`等級加成 <b>+${lv}</b> <span class="tag">騎士每 10 級 +1</span>`:`等級加成 <b>+0</b> <span class="tag">只有騎士有</span>`}</span>`+
    `<span class="chip">魔法娃娃 <b>+${dollV}</b></span>`+
    `<span class="chip">其他傷害加成 <b>${state.other<0?"":"+"}${state.other}</b></span>`+
    `<span class="chip">狀態 <b>+${buffSum}</b></span>`+
    (pvp?`<span class="chip">命中（不含武器）<b>${Math.round(baseHitOf(state,p))}</b></span>`:"");
  BUFFS.forEach(b=>{if(!b.group)$("b-"+b.id).checked=!!state.buffs[b.id];});
  GROUPS.forEach(g=>{const on=BUFFS.find(b=>b.group===g.id&&state.buffs[b.id]);$(g.sel).value=on?on.id:"none";$(g.val).innerHTML=on?buffLine(on):g.none;});
  RBUFFS.forEach(b=>{if(!b.group)$("rb-"+b.id).checked=!!state.buffs[b.id];});
  RGROUPS.forEach(g=>{const on=RBUFFS.find(b=>b.group===g.id&&state.buffs[b.id]);$(g.sel).value=on?on.id:"none";$(g.val).innerHTML=on?rBuffLine(on):g.none;});
  const rows=bow?calcRanged(state):calc(state),unit=bow?"箭":"刀";
  let best=-1;  // only weapons this class can equip compete for 最高
  rows.forEach((r,i)=>{if(r.ok&&(best<0||r.perMin>rows[best].perMin+1e-9))best=i;});
  rows.forEach((r,i)=>{
    $(`w${i}-eb`).textContent=r.eb?`含額外傷害 +${r.eb}`:"";
    $(`r${i}-min`).textContent=fmtInt(r.min);
    $(`r${i}-avg`).textContent=fmtHalf(r.avg);
    $(`r${i}-max`).textContent=fmtInt(r.max);
    $(`r${i}-ps`).textContent=r.perSec.toFixed(1);
    $(`r${i}-pm`).textContent=`每分鐘傷害 ${fmtInt(r.perMin)}・每分鐘 ${r.speed} ${unit}`;
    const base=r.w.hit||0,hc=$(`w${i}-hit`);
    hc.hidden=!r.hit;
    const sg=v=>(v>0?"+":"")+v,parts=[base?`${bow?"弓":"武器"} ${sg(base)}`:"",r.sh?`力量 ${sg(r.sh)}`:"",r.e?`強化 +${r.e}`:""].filter(Boolean);
    hc.innerHTML=r.hit?`命中 <b>${sg(r.hit)}</b>`+(r.e||r.sh?`（${parts.join("、")}）`:""):"";
    $(`w${i}-hr`).hidden=!pvp;
    $(`w${i}-hr`).innerHTML=`預估命中率 <b>${Math.round(r.hitRate*100)}%</b>`;
    const isBest=rows.length>1&&i===best;
    $(`r${i}-best`).hidden=!isBest;
    $(`card-${i}`).classList.toggle("best",isBest);
  });
  save();
}

const GROUPS=[{id:"wpn",sel:"f-wmagic",val:"wmagic-v",n:"武器魔法",none:"祝福、擬似、神聖三選一"},
              {id:"fire",sel:"f-fire",val:"fire-v",n:"火系魔法",none:"火焰武器、舞躍之火、烈炎武器三選一"}];
const buffLine=b=>(b.maxRoll||!b.v?"":`近距離傷害&nbsp;+${b.v}・`)+b.src.replace(/ (?=[+-]\d)/g,"&nbsp;");
$("buffs").innerHTML=
  GROUPS.map(g=>`<div class="row"><span class="row-l"><label class="row-n" for="${g.sel}">${g.n}</label><span class="row-v" id="${g.val}"></span></span><div class="selwrap row-sel"><select id="${g.sel}" data-group="${g.id}"><option value="none">不使用</option>${BUFFS.filter(b=>b.group===g.id).map(b=>`<option value="${b.id}">${b.n} +${b.v}</option>`).join("")}</select></div></div>`).join("")+
  BUFFS.filter(b=>!b.group).map(b=>`<label class="row"><span class="row-l"><span class="row-n">${b.n}</span><span class="row-v">${buffLine(b)}</span></span><span class="switch"><input type="checkbox" id="b-${b.id}" data-buff="${b.id}"><span class="track" aria-hidden="true"></span></span></label>`).join("");
$("f-doll").innerHTML=DOLLS.map(d=>`<option value="${d.id}">${d.n}${d.v?` +${d.v}`:""}</option>`).join("");
// 遠距離 狀態: 風系魔法 and 武器魔法 pick-ones, then the switches (rb- ids; the shared spells keep one on/off for both sides)
const RGROUPS=[{id:"wind",sel:"f-wind",val:"wind-v",n:"風系魔法",none:"風之神射、暴風之眼、暴風神射三選一"},
               {id:"wpn",sel:"f-rwmagic",val:"rwmagic-v",n:"武器魔法",none:"祝福、擬似、神聖三選一",est:true}];
const rBuffLine=b=>[b.v?`${b.dl||"遠距離傷害"}&nbsp;+${b.v}`:"",b.hit?`遠距離命中&nbsp;+${b.hit}`:"",b.src].filter(Boolean).join("・");
$("rbuffs").innerHTML=
  RGROUPS.map(g=>`<div class="row"><span class="row-l"><label class="row-n" for="${g.sel}">${g.n}${g.est?` <span class="tag guess">推算</span>`:""}</label><span class="row-v" id="${g.val}"></span></span><div class="selwrap row-sel"><select id="${g.sel}" data-group="${g.id}"><option value="none">不使用</option>${RBUFFS.filter(b=>b.group===g.id).map(b=>`<option value="${b.id}">${b.n}${b.v?` +${b.v}`:`（命中 +${b.hit}）`}</option>`).join("")}</select></div></div>`).join("")+
  RBUFFS.filter(b=>!b.group).map(b=>`<label class="row"><span class="row-l"><span class="row-n">${b.n}</span><span class="row-v">${rBuffLine(b)}</span></span><span class="switch"><input type="checkbox" id="rb-${b.id}" data-buff="${b.id}"><span class="track" aria-hidden="true"></span></span></label>`).join("");
$("f-arrow").innerHTML=ARROWS.map(a=>`<option value="${a.id}">${a.n}　${a.s}／${a.l}${a.u?"・對不死 +1～20":""}</option>`).join("");
const dollLabel=d=>d.n+(d.v||d.hit?" "+[d.v?`+${d.v}`:"",d.hit?`命中 +${d.hit}`:""].filter(Boolean).join("、"):"");
$("f-rdoll").innerHTML=RDOLLS.map(d=>`<option value="${d.id}">${dollLabel(d)}</option>`).join("");

document.addEventListener("click",e=>{
  const md=e.target.closest("#mode-seg [data-mode]");
  if(md){state.mode=md.dataset.mode;renderWeapons();return;}
  const cs=e.target.closest("#cls-seg [data-cls]");
  if(cs){state.cls=cs.dataset.cls;renderWeapons();return;}
  const sz=e.target.closest("#size-seg [data-size]");
  if(sz){state.size=sz.dataset.size;renderWeapons();return;}
  const rm=e.target.closest("[data-rm]");
  if(rm){weaponList().splice(+rm.dataset.rm,1);renderWeapons();return;}
  if(e.target.closest("#add")){const ws=weaponList(),last=ws[ws.length-1];ws.push({n:last.n,e:last.e});renderWeapons();return;}
  const st=e.target.closest("[data-step]");
  if(st){
    const inp=$(st.dataset.for);
    if(!inp||inp.disabled)return;
    inp.value=clamp((parseInt(inp.value,10)||0)+Number(st.dataset.step),Number(inp.min),Number(inp.max));
    inp.dispatchEvent(new Event("input",{bubbles:true}));
  }
});
document.addEventListener("input",e=>{
  const t=e.target,v=parseInt(t.value,10);
  if(Number.isNaN(v))return;
  if(NUM_IDS.includes(t.id)){state[t.id.slice(2)]=clamp(v,Number(t.min),Number(t.max));update();}
  else if(t.classList.contains("enc")){weaponList()[+t.dataset.w].e=clamp(v,0,12);update();}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("select[data-w]")){
    const i=+t.dataset.w,ws=weaponList();
    ws[i].n=t.value;
    if((state.mode==="ranged"?bowByName:weaponByName)(t.value).noEnchant)ws[i].e=0;
    renderWeapons();
  }else if(t.id==="f-doll"){state.doll=t.value;update();}
  else if(t.id==="f-rdoll"){state.rdoll=t.value;update();}
  else if(t.id==="f-arrow"){state.arrow=t.value;renderWeapons();}
  else if(t.id==="t-undead"){state.undead=t.checked;renderWeapons();}
  else if(t.matches("select[data-group]")){(t.closest("#rbuffs")?RBUFFS:BUFFS).forEach(b=>{if(b.group===t.dataset.group)state.buffs[b.id]=b.id===t.value;});update();}
  else if(t.matches("input[data-buff]")){state.buffs[t.dataset.buff]=t.checked;update();}
  else if(NUM_IDS.includes(t.id)){t.value=state[t.id.slice(2)];}
  else if(t.classList.contains("enc")){t.value=weaponList()[+t.dataset.w].e;}
});
renderWeapons();
</script>
